# Release v2 (25 Oct 2026): EEG + EOG staging (Stage 3 "full" arm, student_N6adv_full_s1, seed 1,
# 175,599 params) + a report model retrained on its packets (ROADMAP R3). Dev: 31/31 verified, 31/31
# at 5/5, 0 violations, numeric fidelity 527/527 (ROADMAP R3 - V2 REPORT MODEL/results/dev_summary.json).
# No test-set run: the test set is closed for selection (COMPARISON WITH EXISTING SYSTEMS/ROADMAP.md).
#
# Everything report-side (grammar, chat template, verifier, renderer, prompt builder) is UNCHANGED from
# v1.1 - same files, same pinned hashes. Only staging and the packet builder differ, because the packet
# builder's own directory is where it reads its fitted tables from (agentic/report/packets.py): pointing
# it at the refitted copy changes calibration, decoder and reliability tiers with no agent code change.

release: v2
description: "Stage 3 EEG+EOG staging (full, seed 1) + Llama-3.2-3B-Student retrained on v2 packets"
packet_schema: "1.3"

staging:
  adapter: n6adv_full
  inputs: ["EEG Fpz-Cz", "EOG horizontal"]
  checkpoint: "ADDING EOG VERSION/kaggle_results/advanced_stage3/results/student_N6adv_full_s1_fixlabels/student_best.pt"
  tables:    # refitted on validation (ADDING EOG VERSION - PIPELINE INTEGRATION/INTEGRATION_REPORT.md);
             # read by the packet builder relative to ITS OWN file, not from here - listed for identity only
    reliability_table: "ADDING EOG VERSION - PIPELINE INTEGRATION/work_n6adv/distillation/reliability_table.json"
    sequence_decoding: "ADDING EOG VERSION - PIPELINE INTEGRATION/work_n6adv/distillation/results/sequence_decoding.json"
    night_confidence: "ADDING EOG VERSION - PIPELINE INTEGRATION/work_n6adv/distillation/results/night_confidence.json"
    derived_metric_reliability: "ADDING EOG VERSION - PIPELINE INTEGRATION/work_n6adv/distillation/results/derived_metric_reliability.json"
    n1_flag: "ADDING EOG VERSION - PIPELINE INTEGRATION/work_n6adv/distillation/results/n1_flag.json"

report:
  prompt_id: P1
  backend: llama-completion
  executable: C:/Users/shahn/tools/llama.cpp/b10927/llama-completion.exe
  runtime_build: b10927
  model: student/slm_models/v2/llama-3.2-3b-instruct-student-v2-q4_k_m.gguf
  grammar: report/claims.gbnf
  chat_template: student/templates/Llama-3.2-3B-Instruct.pinned.jinja   # training pinned the same date as v1
  args: ["-n", "3000", "-c", "12288", "--temp", "0", "--seed", "0", "--no-display-prompt"]
  end_marker: "[end of text]"

code:
  # the ONLY two files that differ from v1.1: the integration's copy, which reads its tables from its own
  # directory (above) and fixes a rounding-tie self-check crash the frozen copy has (PENDING.md K4 / R12)
  packet_builder: "ADDING EOG VERSION - PIPELINE INTEGRATION/work_n6adv_packets/distillation/build_packet.py"
  sequence_decoder: "ADDING EOG VERSION - PIPELINE INTEGRATION/work_n6adv_packets/distillation/sequence_decode.py"
  physiological_features: code/Phase2_47/physiological_features.py   # frozen, unchanged
  prompt_builder: reference/prompts.py
  serializer: report/serialize.py
  claim_schema: report/claim_schema.py
  verifier_structure: report/verify_structure.py
  verifier_policy: report/verify_policy.py
  violations: report/violations.py
  renderer: report/render.py

