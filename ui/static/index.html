<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Somnia · Sleep-Staging Console</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23fbf8f1'/%3E%3Cpath d='M42 14a20 20 0 1 0 12 34A17 17 0 0 1 42 14z' fill='%234457c4'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/overview">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M20.5 14.2A8.6 8.6 0 0 1 9.8 3.5a8.8 8.8 0 1 0 10.7 10.7z" fill="#4457c4"/>
            <path d="M15.5 5.5h5M18 3v5" stroke="#9aa4d9" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-title">Somnia</span>
          <span class="brand-sub">Sleep-Staging Console</span>
        </span>
      </a>

      <nav class="nav" aria-label="Primary">
        <a class="nav-item" href="#/overview" data-page="overview">
          <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>
          <span>Overview</span>
        </a>
        <a class="nav-item" href="#/recordings" data-page="recordings">
          <svg viewBox="0 0 24 24"><path d="M3 12h3l2-7 3 14 2.5-9 2 4h5.5"/></svg>
          <span>Recordings</span>
        </a>
        <a class="nav-item" href="#/new" data-page="new">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          <span>New analysis</span>
        </a>
        <a class="nav-item" href="#/reports" data-page="reports">
          <svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7zM14 3v6h5"/><path d="M10 13h6M10 17h6"/></svg>
          <span>Reports</span>
        </a>
        <a class="nav-item" href="#/evidence" data-page="evidence">
          <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          <span>Evidence</span>
        </a>
        <a class="nav-item" href="#/system" data-page="system">
          <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
          <span>System</span>
        </a>
      </nav>

      <!-- filled from /api/status, so it always shows the release the server actually runs -->
      <div class="sidebar-foot">
        <div class="foot-title">Current release</div>
        <div class="foot-release" id="foot-release">—</div>
        <div class="foot-line"><span class="dot accent"></span><span class="mono" id="foot-model">loading…</span></div>
        <div class="foot-line"><span class="dot" id="foot-pins-dot"></span><span id="foot-detail"></span></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1 id="page-title">Overview</h1>
          <span id="page-sub" class="page-sub"></span>
        </div>
        <div class="topbar-right">
          <div id="status-chips" class="chips"></div>
          <a class="btn btn-primary btn-sm" href="#/new">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            New analysis
          </a>
        </div>
      </header>

      <div id="view" class="view" aria-live="polite">
        <div class="splash">
          <div class="spinner"></div>
          <p>Loading the console…</p>
        </div>
      </div>
    </main>
  </div>

  <div id="toasts" class="toasts" aria-live="assertive"></div>
  <script src="/static/app.js"></script>
</body>
</html>
